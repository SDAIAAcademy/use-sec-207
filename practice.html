<section>
<h2>اليوم 1: ما يساعد المحامي وما يقرر في حق شخص</h2>
<ol>
<li><p>أربعة استخدامات في جهة عدلية. أيها يدخل مخرجه في قرار في حق شخص بعينه؟</p><ul><li><b>أ.</b> مسودة رد على استفسار إداري يعدلها موظف القسم</li><li><b>ب.</b> ترتيب طلبات زيارة النزلاء على المواعيد</li><li><b>ج.</b> فهرسة أرشيف الأنظمة المنشورة بحسب الموضوع</li><li><b>د.</b> ملخص تعميم داخلي جديد يقرؤه الموظفون</li></ul></li>
<li><p>في قاعدة أحكام دولة وسم، «مرجع» يقول إن العامل المستقيل يستحق مكافأة نهاية الخدمة كاملة «(الحكم عمالي 2022/40)». الحكم موجود ونافذ، ومبدؤه: المكافأة تُحسب على آخر أجر.</p><ul><li><b>أ.</b> سليم</li><li><b>ب.</b> مختلق</li><li><b>ج.</b> لا يدعم القول</li><li><b>د.</b> متجاوَز</li></ul></li>
<li><p>«مرجع» يذكر المادة 9 ومهلة ثلاثين يومًا. بحثت عن المادة 9 فوجدتها في ملف النظام. ما الذي يحسم الحكم على المرجع؟</p><ul><li><b>أ.</b> قراءة النص النافذ للمادة وتاريخ آخر تعديل لها</li><li><b>ب.</b> الحكم بأنه سليم لأن رقم المادة صحيح</li><li><b>ج.</b> سؤال «مرجع» مرة أخرى بصياغة مختلفة</li><li><b>د.</b> البحث عن الرقم في مذكرات سابقة في المركز</li></ul></li>
<li><p>المورّد يقول إن دقة «محضر» في الكلمات 96% على تسجيلاته. ما الذي تطلبه أولًا قبل أن تعتمده لمحاضر الجلسات؟</p><ul><li><b>أ.</b> لا شيء: 96% أعلى من دقة كاتب متعب في آخر جلسة من يومه</li><li><b>ب.</b> نسبة الدقة بمنزلتين عشريتين على العينة نفسها، مع حجم العينة</li><li><b>ج.</b> سرعة النسخ بالدقائق لكل ساعة تسجيل، مقارنة بالكاتب</li><li><b>د.</b> أخطاء الأرقام والنفي ونسبة الكلام في تسجيلات قاعاتك</li></ul></li>
<li><p>عقد صيانة لنظام المواعيد: المورّد يطّلع على بيانات المراجعين، ولا بند لحماية البيانات. «إحكام» قال في P2: «مطابق»، بلا ملاحظة. المفتاح: «مخالف».</p><ul><li><b>أ.</b> صحيح</li><li><b>ب.</b> إغفال</li><li><b>ج.</b> تنبيه زائف</li><li><b>د.</b> لا ينطبق</li></ul></li>
<li><p>في مراجعة 12 عقدًا: 96 صفًا، منها 16 مخالفة حقيقية في المفتاح. فات الأداة 4 منها، وأطلقت 14 تنبيهًا منها 2 زائفان. ما معدل الإغفال؟</p><ul><li><b>أ.</b> 4 من 16، أي 25%</li><li><b>ب.</b> 4 من 96، أي 4%</li><li><b>ج.</b> 2 من 14، أي 14%</li><li><b>د.</b> 4 من 14، أي 29%</li></ul></li>
<li><p>تريد أن تقول للجنة كم مذكرة من «مرجع» كانت ستصل إلى قاضٍ وفيها خطأ. أي رقم من سجلك؟</p><ul><li><b>أ.</b> 9 من 24 مرجعًا معيبًا (38%)</li><li><b>ب.</b> 3 مراجع مختلقة من 24 مرجعًا</li><li><b>ج.</b> 8 من 12 إجابة معيبة (67%)</li><li><b>د.</b> 4 من 12 مخالفة فائتة (33%)</li></ul></li>
<li><p>مقطع مرئي لحادث سير قدّمه أحد الطرفين بالبريد الإلكتروني. لا ملف أصلي ولا بصمة عند الضبط، وأداة كشف تقول: «أصلي بنسبة 95%». الحكم يُبنى عليه في الغالب.</p><ul><li><b>أ.</b> قبول الملف دليلًا، فأداة الكشف تقول إنه أصلي</li><li><b>ب.</b> استبعاد الملف من الدعوى لأنه لا أصل له</li><li><b>ج.</b> إحالة إلى القاضي كمسألة نزاهة</li><li><b>د.</b> إحالة إلى خبير رقمي، وطلب الأصل وبياناته</li></ul></li>
<li><p>إدارة المساعدة القانونية تجرب أداة تعطي كل طلب درجة لوجاهة الدعوى، ويراجع موظف كل طلب دون 30 قبل رفضه. في أي فئة تقع الأداة؟</p><ul><li><b>أ.</b> يساعد محاميًا، لأن الموظف يراجع قبل الرفض</li><li><b>ب.</b> يُبنى عليه قرار يخص شخصًا</li><li><b>ج.</b> خارج الفئتين، لأنها لا تكتب نصًا قانونيًا</li><li><b>د.</b> يساعد محاميًا، لأن الدرجة لا تُنشر للطالب</li></ul></li>
<li><p>مساعد يكتب المسودة الأولى لاتفاقية عدم إفصاح من نموذج الوزارة المعتمد، ويعدلها محامي الإدارة قبل الإرسال. ما الذي يجعلها «يساعد محاميًا»؟</p><ul><li><b>أ.</b> أن النموذج الذي تبدأ منه المسودة معتمد من الوزارة</li><li><b>ب.</b> أن اتفاقيات عدم الإفصاح قليلة المخاطر دائمًا</li><li><b>ج.</b> أن محاميًا يراجعها ولا تقع على شخص بعينه</li><li><b>د.</b> أن المساعد لا يرى بيانات شخصية في المسودة</li></ul></li>
<li><p>أداة تلخص ملف القضية للقاضي وتقترح مقدار التعويض. يقول المورّد: «القاضي يقرر، فالأداة مساعدة». ما الرد الأدق؟</p><ul><li><b>أ.</b> الرد غير لازم: القاضي مسؤول عن حكمه، فالفئة «يساعد»</li><li><b>ب.</b> الاقتراح يدخل في حكم يخص الطرفين، فيحتاج ضمانات</li><li><b>ج.</b> الأداة غير مقبولة في المحكمة لأنها تقترح رقمًا للتعويض</li><li><b>د.</b> الفئة تتحدد بدقة الأداة على أحكام سابقة منشورة</li></ul></li>
<li><p>«محضر» يترجم إفادة طرف أجنبي، وتودع الترجمة ملف القضية ليقرأها القاضي. ما الذي يحسم أن الاستخدام «يُبنى عليه قرار»؟</p><ul><li><b>أ.</b> أن الترجمة آلية لا بشرية، ولو راجعها مترجم بعد ذلك</li><li><b>ب.</b> أن المترجم البشري أبطأ من الأداة في الإفادات الطويلة</li><li><b>ج.</b> أن الإفادة سرية ومحفوظة في ملف القضية</li><li><b>د.</b> أن القاضي يبني عليها حكمًا والطرف لا يصححها</li></ul></li>
<li><p>تدقق مذكرة: المادة المذكورة موجودة في النظام ونافذة، لكن نصها يتحدث عن مهلة الاستئناف لا عن مهلة التظلم التي نُسبت إليها. ما حكم المرجع؟</p><ul><li><b>أ.</b> سليم، لأن المادة موجودة ونافذة</li><li><b>ب.</b> لا يدعم القول</li><li><b>ج.</b> مختلق</li><li><b>د.</b> متجاوَز</li></ul></li>
<li><p>مذكرة تستشهد بحكم موجود في قاعدة الأحكام ومبدؤه كما نُقل حرفيًا، لكن الحكم نُقض في الاستئناف العام الماضي. ما حكم المرجع؟</p><ul><li><b>أ.</b> متجاوَز</li><li><b>ب.</b> سليم، لأن الاقتباس مطابق</li><li><b>ج.</b> اقتباس غير موجود</li><li><b>د.</b> مختلق</li></ul></li>
<li><p>دققت 30 إجابة فيها 75 مرجعًا. وجدت 9 مراجع معيبة موزعة على 7 إجابات. أي جملة تضعها أمام لجنة تسأل: كم مذكرة كانت ستصل إلى قاضٍ بخطأ؟</p><ul><li><b>أ.</b> 9 من 75 مرجعًا معيبًا (12%)</li><li><b>ب.</b> 9 من 30 إجابة فيها خطأ (30%)</li><li><b>ج.</b> 7 من 30 إجابة (23%)</li><li><b>د.</b> 7 من 75 مرجعًا (9%)</li></ul></li>
<li><p>أداة مراجعة عقود على 20 عقدًا: في المفتاح 25 مخالفة، فاتت الأداة 5 منها، وأطلقت 30 تنبيهًا منها 10 زائفة. ما معدل الإغفال؟</p><ul><li><b>أ.</b> 5 من 160 فحصًا</li><li><b>ب.</b> 10 من 30</li><li><b>ج.</b> 5 من 30</li><li><b>د.</b> 5 من 25، أي 20%</li></ul></li>
<li><p>تقرير مورّد: أداة النسخ دقيقة بنسبة 97% في الكلمات على تسجيلات استوديو. أي اختبار يقنعك قبل اعتمادها لمحاضر الجلسات؟</p><ul><li><b>أ.</b> تكرار القياس نفسه على تسجيلات المورّد، بعينة أكبر</li><li><b>ب.</b> عدّ أخطاء الأرقام والنفي والمتحدث على تسجيلات قاعاتك</li><li><b>ج.</b> قياس السرعة على ساعة تسجيل من قاعاتك</li><li><b>د.</b> سؤال الكتبة هل يرضون عن الأداة بعد أسبوع تجربة</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: الفرز والإجراءات العادلة والخريطة</h2>
<ol>
<li><p>مذكرة من «مرجع» تستشهد بحكم موجود برقمه في قاعدة الأحكام، ونصه المقتبس مطابق حرفيًا. ما الخطوة التي بقيت قبل الحكم بأنه سليم؟</p><ul><li><b>أ.</b> البحث عن رقم الحكم مرة ثانية</li><li><b>ب.</b> فتح حالة الحكم: هل نُقض أو عُدل بعده</li><li><b>ج.</b> سؤال مساعد آخر عن الحكم</li><li><b>د.</b> التأكد أن الحكم ذُكر في مذكرات سابقة</li></ul></li>
<li><p>سلطان الحربي يريد رقمًا واحدًا يقول كم صاحب دعوى عاجلة سينتظر في القائمة العادية. أي خانة يقرأ؟</p><ul><li><b>أ.</b> عاجل وفوق العتبة</li><li><b>ب.</b> عادي وفوق العتبة</li><li><b>ج.</b> عاجل ودون العتبة</li><li><b>د.</b> الدقة الإجمالية للجدول</li></ul></li>
<li><p>في محكمة أخرى خُفضت العتبة حتى لم تعد تفوت أي دعوى عاجلة، فصار يصل إلى المكتب العاجل 300 صحيفة في الشهر، وطاقته 150. ما الحكم الأدق؟</p><ul><li><b>أ.</b> المكتب يتلقى ضعف طاقته، فتتأخر الدعاوى العاجلة داخله</li><li><b>ب.</b> العتبة المثلى، لأن لا شيء يفوت</li><li><b>ج.</b> لا فرق على أصحاب الدعاوى، فالزيادة على الكتبة وحدهم</li><li><b>د.</b> جدول الالتباس لا يتغير، فالعتبة لا تغير شيئًا</li></ul></li>
<li><p>معدل الفوات الإجمالي عند العتبة 60 هو 17%. ما الذي تحتاجه لتعرف هل يقع الفوات بالتساوي؟</p><ul><li><b>أ.</b> المعدل الإجمالي نفسه محسوبًا على عدد أكبر من الصحف</li><li><b>ب.</b> الدقة الإجمالية للمصنِّف عند العتبة نفسها</li><li><b>ج.</b> نسبة كل فئة من مجموع الدعاوى العاجلة الفائتة</li><li><b>د.</b> معدل الفوات في كل فئة على حدة</li></ul></li>
<li><p>رسالة رفض طلب مساعدة قانونية: «لم يستوفِ طلبك معايير الأهلية». موقّعة من مدير الإدارة، وفيها مهلة التظلم. ولا ذكر فيها لنظام التقييم الآلي الذي أعطى الطلب درجته. أي متطلبين تحكم عليهما بأنهما ثغرة من الرسالة وحدها؟</p><ul><li><b>أ.</b> المراجعة البشرية والسجل</li><li><b>ب.</b> الإشعار والتفسير</li><li><b>ج.</b> صاحب القرار والتظلم</li><li><b>د.</b> لا ثغرة: الرسالة موقّعة وفيها المهلة</li></ul></li>
<li><p>في سجل موقوف عنوان قديم يضعه في حي لم يعد يسكنه، فارتفعت درجته. له التظلم خلال خمسة أيام، ولا يرى مدخلات الدرجة.</p><ul><li><b>أ.</b> إعادة تدريب «ترجيح» على بيانات أحدث من دولة وسم</li><li><b>ب.</b> مدّ مهلة التظلم من خمسة أيام إلى عشرة أيام</li><li><b>ج.</b> تسليم المدخلات مع القرار، والبت في تصحيحها أولًا</li><li><b>د.</b> مراجع ثانٍ يوقّع على كل قرار مرتفع الدرجة</li></ul></li>
<li><p>مورّد «أسبقية» يقول إن أداته ليست عالية المخاطر لأنها «تصنف المستندات الواردة» فقط. ما الرد الأدق؟</p><ul><li><b>أ.</b> الترتيب هنا يحدد أولوية شخص، فيحتاج تقييمًا موثقًا</li><li><b>ب.</b> الرد غير لازم: الحيثية 53 تذكر تصنيف المستندات الواردة بالاسم</li><li><b>ج.</b> كل أداة تُستخدم في محكمة عالية المخاطر بالضرورة</li><li><b>د.</b> الرد غير لازم لأن القانون لا يسري على دولة وسم</li></ul></li>
<li><p>حالة تقترح آليًا الحجز على راتب المدين، وتُعرض التوصية على قاضي التنفيذ ليقرر بعد مراجعة. القيمة 2، والجاهزية 1، والخطأ 3، والتراجع 2، والطعن 1.</p><ul><li><b>أ.</b> متوقفة عند البوابة</li><li><b>ب.</b> تجربة بضوابط</li><li><b>ج.</b> لاحقًا</li><li><b>د.</b> لا الآن</li></ul></li>
<li><p>في تجربة «مرجع» راجعتم كل مراجع 60 مذكرة، ولم تجدوا مرجعًا مختلقًا واحدًا.</p><ul><li><b>أ.</b> معدل الاختلاق صفر، فالأداة لا تختلق</li><li><b>ب.</b> على الأرجح أقل من نحو 5%، ولا تكفي لأقل</li><li><b>ج.</b> معدل الاختلاق أقل من 1% على الأرجح</li><li><b>د.</b> لا شيء يُقال، فالعينة صغيرة جدًا</li></ul></li>
<li><p>في جدول الالتباس لمصنِّف الفرز، أي خانة تعني أن صاحب دعوى عاجلة سينتظر في القائمة العادية؟</p><ul><li><b>أ.</b> عادي وفوق العتبة</li><li><b>ب.</b> عاجل وفوق العتبة</li><li><b>ج.</b> عاجل ودون العتبة</li><li><b>د.</b> عادي ودون العتبة</li></ul></li>
<li><p>في محكمة أخرى، خفض عتبة الفرز جعل الفائت صفرًا، ورفع ما يذهب إلى المكتب العاجل من 120 إلى 300 في الشهر، وطاقته 150. ما الأثر الأدق؟</p><ul><li><b>أ.</b> تحسّن كامل، لأن لا دعوى عاجلة تفوت الآن</li><li><b>ب.</b> المكتب يمتلئ بضعف طاقته، فيتأخر العاجل داخله</li><li><b>ج.</b> لا أثر، لأن الصحف الزائدة غير عاجلة وستُعاد</li><li><b>د.</b> الأثر على الكتبة وحدهم، لا على أصحاب الدعاوى</li></ul></li>
<li><p>في محكمة أخرى فات مصنِّفَ الفرز ثلث الدعاوى العاجلة التي رفعها أصحابها بأنفسهم، ولم يفته شيء تقريبًا مما رفعه محامون. ما التفسير الأرجح إذا كان قد تعلّم من قرارات الكتبة السابقة؟</p><ul><li><b>أ.</b> أصحاب الدعاوى بأنفسهم يرفعون دعاوى أقل استعجالًا في الغالب</li><li><b>ب.</b> المصنف عشوائي في أخطائه، والفرق بين الفئتين مصادفة</li><li><b>ج.</b> تعلّم تقديم الصحف المكتوبة بلغة قانونية</li><li><b>د.</b> العتبة أعلى من اللازم للجميع بالتساوي</li></ul></li>
<li><p>في فرز الدعاوى، من يتحمل خطأ «عادي وفوق العتبة»؟</p><ul><li><b>أ.</b> أصحاب الدعاوى العاجلة الآخرون في الطابور</li><li><b>ب.</b> صاحب الصحيفة نفسها، لأنه سينتظر ستة أسابيع</li><li><b>ج.</b> لا أحد، فالخطأ في الاتجاه الآمن دائمًا</li><li><b>د.</b> المورّد، لأنه ضبط العتبة</li></ul></li>
<li><p>نموذج قرار التوقيف يقول: «الأسباب: الخطورة مرتفعة بحسب ترجيح». الموقوف لا يعلم ما «ترجيح» ولا ما الذي رفع درجته. أي متطلبين لم يُستوفيا؟</p><ul><li><b>أ.</b> المراجعة البشرية والسجل</li><li><b>ب.</b> الإشعار والتفسير</li><li><b>ج.</b> صاحب القرار المسؤول والتظلم</li><li><b>د.</b> لا متطلب، لأن الأداة مذكورة باسمها</li></ul></li>
<li><p>عضو النيابة يراجع 40 ملفًا في اليوم بثلاث دقائق لكل ملف، وخالف الدرجة في 1% من القرارات. ما الحكم على المراجعة البشرية؟</p><ul><li><b>أ.</b> كافية، لأن عضو النيابة يوقّع كل قرار باسمه</li><li><b>ب.</b> كافية، لأن نسبة المخالفة المنخفضة تدل على دقة الدرجة</li><li><b>ج.</b> ثغرة: الوقت لا يكفي لمخالفة الدرجة</li><li><b>د.</b> لا يمكن الحكم دون معرفة دقة الدرجة على بيانات وسم</li></ul></li>
<li><p>موقوف في سجله عنوان قديم يضعه في حي لم يعد يسكنه، فارتفعت درجته. له التظلم خلال خمسة أيام، ولا يطلع على مدخلات الدرجة. ما الضابط الأهم؟</p><ul><li><b>أ.</b> رفع مهلة التظلم من خمسة أيام إلى عشرة أيام</li><li><b>ب.</b> إعادة تدريب النموذج على بيانات أحدث</li><li><b>ج.</b> إضافة مراجع ثانٍ يوقّع كل قرار مرتفع الدرجة</li><li><b>د.</b> تسليم المدخلات مع القرار، والبت في تصحيحها أولًا</li></ul></li>
<li><p>وفق تعديل الاتحاد الأوروبي المنشور في يوليو 2026 (اللائحة 2026/1744)، متى تبدأ متطلبات الأنظمة عالية المخاطر المذكورة في الملحق الثالث، ومنها أنظمة إقامة العدل؟</p><ul><li><b>أ.</b> 2 أغسطس 2026، كما في النص الأصلي</li><li><b>ب.</b> 2 ديسمبر 2027</li><li><b>ج.</b> 2 أغسطس 2028، مع الأنظمة المدمجة في المنتجات</li><li><b>د.</b> بدأت منذ نشر القانون عام 2024</li></ul></li>
<li><p>حالة استخدام: رفض آلي لطلبات المساعدة القانونية التي تقل درجتها عن 30، دون مراجع قبل الرفض. قيمتها 2 وجاهزيتها 2. أين تضعها في الخريطة؟</p><ul><li><b>أ.</b> لاحقًا، لأن الفرصة 4</li><li><b>ب.</b> تجربة بضوابط</li><li><b>ج.</b> متوقفة عند البوابة</li><li><b>د.</b> لا الآن</li></ul></li>
<li><p>إخفاء البيانات الشخصية من الأحكام قبل نشرها: إن فات اسم ونُشر الحكم فلا يُستعاد. كم تعطي «قابلية التراجع» على مقياس 1 إلى 3؟</p><ul><li><b>أ.</b> 1: الأثر لا يُستعاد</li><li><b>ب.</b> 2: يُصحح جزئيًا</li><li><b>ج.</b> 3: يُصحح قبل أثره</li><li><b>د.</b> لا ينطبق، لأنه لا يقع على شخص</li></ul></li>
<li><p>في تجربة لمساعد البحث راجعتم 60 مذكرة ولم تجدوا مرجعًا مختلقًا واحدًا. ما الذي تستطيع أن تقوله للجنة؟</p><ul><li><b>أ.</b> معدل الاختلاق صفر، فالأداة لا تختلق</li><li><b>ب.</b> على الأرجح أقل من نحو 5%، ولا تكفي لأقل</li><li><b>ج.</b> معدل الاختلاق أقل من 1% على الأرجح</li><li><b>د.</b> لا شيء يُقال، فالعينة صغيرة جدًا</li></ul></li>
<li><p>أي قاعدة توقف أنسب لتجربة «مرجع» في مركز البحوث؟</p><ul><li><b>أ.</b> التوقف إذا قلّ رضا الباحثين عن الأداة في الاستبيان الشهري</li><li><b>ب.</b> التوقف إذا تجاوز معدل الخطأ 50% في الشهر</li><li><b>ج.</b> لا قاعدة توقف في التجربة، لأنها تجربة ستنتهي</li><li><b>د.</b> مرجع مختلق واحد في مذكرة خرجت يوقفها</li></ul></li>
</ol>
